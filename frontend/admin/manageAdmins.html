</head>
<body>
  <button class="admin-sidebar-backdrop" type="button" aria-label="Close navigation menu" aria-hidden="true"></button>
  <aside class="admin-sidebar" id="adminSidebar" aria-label="Admin navigation" aria-hidden="true">
    <div class="admin-title">
      <span class="admin-title-mark" aria-hidden="true">B</span>
      <span class="admin-title-copy"><strong>BIMS</strong><small>Administrator Portal</small></span>
    </div>
    <a href="/admin/dashboard.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Dashboard</span></a>
    <a href="/admin/Analytics.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 14 4-4 4 3 6-7"/></svg><span>Analytics</span></a>
    <a href="/admin/residents.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2"/><path d="M16 4.5a4 4 0 0 1 0 7.5m2 3a6 6 0 0 1 4 5.5V21"/></svg><span>Resident Management</span></a>
    <a class="active" href="/admin/manageAdmins.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2 20v-1a7 7 0 0 1 14 0v1"/><path d="M16 5.5a3.5 3.5 0 0 1 0 6.8M18 15a5 5 0 0 1 4 4.8V20"/></svg><span>Admin Management</span></a>
    <a href="/admin/requests.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8m-8 4h8"/></svg><span>Services and Request Management</span></a>
    <a href="/admin/concerns.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/><path d="M12 8v4m0 4h.01"/></svg><span>Concerns and Reports</span></a>
    <a href="/admin/account.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Account Management</span></a>
    <button id="logoutButton"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5m5 5H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg><span>Log Out</span></button>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <button class="sidebar-toggle" type="button" aria-label="Open navigation menu" aria-controls="adminSidebar" aria-expanded="false">☰</button>
      <h1>ADMIN MANAGEMENT</h1>
    </header>
    <section class="admin-content">
      <div class="admin-panel">
        <h2>Create Admin / Staff Account</h2>
        <p class="muted">Only an Administrator can create another admin account.</p>
        <form id="adminForm" class="admin-form">
          <label>Username<input name="username" required></label>
          <label>Full Name<input name="fullName" required></label>
          <label>Email<input name="email" type="email"></label>
          <label>Password<input name="password" type="password" minlength="8" required></label>
          <label>Role
            <select name="role"><option>Administrator</option><option>Staff</option></select>
          </label>
          <button class="button" type="submit">Create Account</button>
          <p id="message" class="form-message"></p>
        </form>
      </div>
    </section>
  </main>
  <script src="/js/admin-sidebar.js"></script>
  <script src="/js/admin-admins.js"></script>
</body>
</html>
